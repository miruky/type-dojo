<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="type-dojoのアーキテクチャ図">
  <title>type-dojoのアーキテクチャ</title>
  <style>
    .box { fill: none; stroke: #8b949e; stroke-width: 1.5; }
    .accent-box { fill: none; stroke: #d9694f; stroke-width: 1.5; }
    .label { font: 600 14px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: #6b7280; }
    .small { font: 400 11.5px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: #6b7280; }
    .accent-label { font: 700 14px 'Hiragino Sans', 'Noto Sans JP', sans-serif; fill: #c0452a; }
    .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="20" y="95" width="190" height="70" rx="8" class="accent-box"/>
  <text x="40" y="123" class="accent-label">challenges/</text>
  <text x="40" y="145" class="small">18問の出題・テスト・公式解</text>

  <rect x="280" y="95" width="180" height="70" rx="8" class="accent-box"/>
  <text x="300" y="123" class="accent-label">app.ts</text>
  <text x="300" y="145" class="small">エディタ / 進捗 / 診断表示</text>

  <rect x="530" y="95" width="160" height="70" rx="8" class="box"/>
  <text x="550" y="123" class="label">judge.worker.ts</text>
  <text x="550" y="145" class="small">UIスレッドから隔離</text>

  <rect x="740" y="95" width="140" height="70" rx="8" class="accent-box"/>
  <text x="760" y="123" class="accent-label">judge.ts</text>
  <text x="760" y="145" class="small">LanguageService</text>

  <rect x="740" y="20" width="140" height="44" rx="8" class="box"/>
  <text x="760" y="47" class="label">同梱libファイル</text>

  <rect x="530" y="200" width="350" height="40" rx="8" class="box"/>
  <text x="550" y="225" class="small">前置ヘルパー + 解答 + テスト を1ファイルに連結して型検査</text>

  <path class="arrow" d="M210 130 H272"/>
  <path class="arrow" d="M460 120 H522"/>
  <path class="arrow" d="M690 130 H732"/>
  <path class="arrow" d="M810 64 V87"/>
  <path class="arrow" d="M530 140 C500 150 480 145 468 140"/>
  <text x="480" y="170" class="small">診断列(セクションと行番号つき)</text>
</svg>
